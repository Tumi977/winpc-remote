name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
        env:
          NO_PROXY: 127.0.0.1,localhost
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查仓库里没有误提交的令牌/私钥
        run: |
          # 选项必须放在模式之前；模式以 - 开头，所以用 -e。grep 出错（退出码 2）也要让 CI 失败，避免假绿。
          set +e
          grep -rIEl --exclude-dir=.git --exclude-dir=tests --exclude=fileops.py --exclude=test.yml \
            -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' -e 'PuTTY-User-Key-File' .
          rc=$?
          if [ $rc -eq 0 ]; then echo "发现疑似私钥/令牌文件，见上方列表"; exit 1; fi
          if [ $rc -ne 1 ]; then echo "扫描命令自身出错 (rc=$rc)"; exit 1; fi
