name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
        env:
          NO_PROXY: 127.0.0.1,localhost
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that no token / private key was committed by mistake
        run: |
          # Options must come before the pattern; the pattern starts with -, hence -e. A grep error (exit code 2) must also fail CI, to avoid a false green.
          set +e
          grep -rIEl --exclude-dir=.git --exclude-dir=tests --exclude=fileops.py --exclude=test.yml \
            -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' -e 'PuTTY-User-Key-File' .
          rc=$?
          if [ $rc -eq 0 ]; then echo "Suspected private-key/token files found, see the list above"; exit 1; fi
          if [ $rc -ne 1 ]; then echo "The scan command itself failed (rc=$rc)"; exit 1; fi
